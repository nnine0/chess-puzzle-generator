<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Puzzles</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>♟ Chess Puzzle Generator</h1>
      <div id="controls">
        <select id="difficulty">
          <option value="beginner">Beginner (0-800)</option>
          <option value="easy" selected>Easy (800-1200)</option>
          <option value="medium">Medium (1200-1800)</option>
          <option value="hard">Hard (1800-2200)</option>
          <option value="master">Master (2200+)</option>
        </select>
        <select id="color-scheme">
          <option value="classic">Classic</option>
          <option value="high-contrast">High Contrast</option>
          <option value="blue">Blue</option>
          <option value="forest">Forest</option>
          <option value="midnight">Midnight</option>
        </select>
        <button id="new-puzzle-btn">New Puzzle</button>
        <button id="hint-btn">Hint</button>
      </div>
    </header>
    <main>
      <div id="board-container">
        <div id="board" data-theme="classic"></div>
      </div>
      <div id="sidebar">
        <div id="puzzle-info">
          <div id="status">Waiting for puzzle...</div>
          <div id="rating"></div>
          <div id="themes"></div>
        </div>
        <div id="move-history"></div>
      </div>
    </main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
